<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex box</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</head>
<body>
    <div class="parent d-flex justify-content-around align-items-center flex-wrap gap-2" style="width: 100%; height: 100vh;">
        <div class="child rounded-4 shadow-lg bg-opacity-75 bg-danger d-flex justify-content-center align-items-center fw-bold text-white fs-4 " style="width: 250px; height: 250px;">Child</div>
        <div class="child rounded-4 shadow-lg bg-opacity-75 bg-primary d-flex justify-content-center align-items-center fw-bold text-white fs-4 " style="width: 250px; height: 250px;">Child</div>
        <div class="child rounded-4 shadow-lg bg-opacity-75 bg-warning d-flex justify-content-center align-items-center fw-bold text-white fs-4 " style="width: 250px; height: 250px;">Child</div>
        <div class="child rounded-4 shadow-lg bg-opacity-75 bg-success d-flex justify-content-center align-items-center fw-bold text-white fs-4 " style="width: 250px; height: 250px;">Child</div>
    </div>
</body>
</html>
